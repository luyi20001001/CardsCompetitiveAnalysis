# Cloudflare Workers 設定（免費方案即可）
name = "card-compare"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# 網站靜態檔
[assets]
directory = "./public"
binding = "ASSETS"

# 儲存網址覆蓋值、缺漏紀錄與網頁快取
# 執行 `npx wrangler kv namespace create STORE` 後，把回傳的 id 貼到下面
[[kv_namespaces]]
binding = "STORE"
id = "請貼上你的 KV namespace id"

[vars]
# 同一個官方網址在幾分鐘內重複查詢時直接用快取（最少 1 分鐘）
CACHE_MINUTES = "60"
# （選用）若之後設定了 GEMINI_API_KEY，會改用 Gemini 擷取；設成 "false" 可強制使用內建爬蟲
USE_GEMINI = "true"
GEMINI_MODEL = "gemini-2.5-flash"

# 機密請用指令設定，不要寫在這個檔案裡：
#   npx wrangler secret put ADMIN_PASSWORD     （必要）
#   npx wrangler secret put SESSION_SECRET     （必要）
#   npx wrangler secret put GEMINI_API_KEY     （選用，不設定就使用內建爬蟲）
